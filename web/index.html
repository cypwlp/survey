<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小威問卷 · 管理端</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">小威問卷</a>
      <nav class="nav" id="nav" style="display:none">
        <a href="index.html">我的問卷</a>
        <a href="create.html">建立問卷</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <span class="eyebrow">管理端 · WEB</span>
      <h1>小威問卷</h1>
      <p>建立問卷、分享連結、查看統計；資料與小程序共用同一套。</p>
    </div>
  </section>

  <main class="wrap overlap">
    <section id="loginCard" class="card login-card">
      <h2>管理員登入</h2>
      <p class="muted" style="margin-top:0">輸入你在雲托管設定的 <b>WEB_ADMIN_PASSWORD</b>。</p>
      <form id="loginForm">
        <label class="label" for="password">管理員密碼</label>
        <input id="password" class="input" type="password" autocomplete="current-password" placeholder="輸入密碼" required>
        <div class="btn-row">
          <button class="btn btn-primary btn-block" type="submit">登入</button>
        </div>
      </form>
      <div id="loginError" class="notice notice-err hidden"></div>
      <p class="hint">密碼只存在這個瀏覽器的 sessionStorage，關閉分頁即登出。</p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="card">
        <div class="row">
          <h2 class="sec-title" style="margin:0">我的問卷</h2>
          <a class="btn btn-primary btn-sm" href="create.html">＋ 建立問卷</a>
        </div>
        <div class="kpis" style="margin-top:18px">
          <div class="kpi"><b id="kpiTotal">0</b><span>全部問卷</span></div>
          <div class="kpi hi"><b id="kpiLive">0</b><span>進行中</span></div>
          <div class="kpi"><b id="kpiAnswers">0</b><span>累計提交</span></div>
        </div>
      </div>

      <div id="list"></div>

      <div class="row" style="justify-content:flex-end">
        <button id="logoutBtn" class="btn btn-quiet btn-sm">登出</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/api.js"></script>
  <script>
    (function () {
      const loginCard = document.getElementById('loginCard');
      const dashboard = document.getElementById('dashboard');
      const nav = document.getElementById('nav');
      const listEl = document.getElementById('list');
      const loginError = document.getElementById('loginError');
      const passwordEl = document.getElementById('password');

      function showLogin(msg) {
        dashboard.classList.add('hidden');
        nav.style.display = 'none';
        loginCard.classList.remove('hidden');
        loginError.classList.add('hidden');
        loginError.textContent = '';
        if (msg) {
          loginError.textContent = msg;
          loginError.classList.remove('hidden');
        }
      }

      function showDashboard() {
        loginCard.classList.add('hidden');
        dashboard.classList.remove('hidden');
        nav.style.display = '';
      }

      function render(list) {
        const total = list.length;
        const live = list.filter((s) => !s.IsClosed && !s.IsExpired).length;
        const answers = list.reduce((n, s) => n + (Number(s.AnswerCount) || 0), 0);
        document.getElementById('kpiTotal').textContent = total;
        document.getElementById('kpiLive').textContent = live;
        document.getElementById('kpiAnswers').textContent = answers;

        if (!total) {
          listEl.innerHTML = '<div class="card empty"><div class="glyph">◍</div>還沒有問卷，點右上角「建立問卷」開始。</div>';
          return;
        }

        listEl.innerHTML = list.map((s) => {
          const ended = !!(s.IsClosed || s.IsExpired);
          const status = s.IsClosed ? '已結束' : (s.IsExpired ? '已截止' : '進行中');
          const tagClass = ended ? 'tag-end' : 'tag-live';
          const group = s.GroupName ? Survey.esc(s.GroupName) : '未設定群名';
          return `
            <a class="card survey-card" href="survey.html?id=${encodeURIComponent(s.SurveyId)}">
              <div class="row" style="align-items:flex-start">
                <h3 class="survey-title">${Survey.esc(s.Title)}</h3>
                <span class="tag ${tagClass}">${status}</span>
              </div>
              <div class="survey-meta">${group}｜${s.BindMode === 'group' ? '綁定群組' : '開放作答'}｜建立 ${Survey.fmtTime(s.CreateTime)}</div>
              <div class="survey-stats">
                <div class="survey-stat"><b>${Number(s.AnswerCount) || 0}</b><span>份提交</span></div>
                <div class="survey-stat"><b>${Number(s.VisitCount) || 0}</b><span>人開啟</span></div>
                <div class="survey-stat survey-stat--sm"><b>${s.Deadline ? Survey.fmtTime(s.Deadline) : '—'}</b><span>截止時間</span></div>
              </div>
            </a>`;
        }).join('');
      }

      async function load() {
        try {
          const res = await Survey.apiAdmin('/surveys');
          showDashboard();
          render(res.list || []);
        } catch (e) {
          if (e.status === 401) {
            Survey.clearAdminPassword();
            showLogin('管理員密碼不正確');
            return;
          }
          showLogin(e.message || '載入失敗');
        }
      }

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const p = passwordEl.value.trim();
        if (!p) return;
        Survey.setAdminPassword(p);
        await load();
        if (Survey.getAdminPassword()) passwordEl.value = '';
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        Survey.clearAdminPassword();
        showLogin();
      });

      if (Survey.getAdminPassword()) {
        load();
      } else {
        showLogin();
      }
    })();
  </script>
</body>
</html>
